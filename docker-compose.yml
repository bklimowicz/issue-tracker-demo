services:
  db:
    image: postgres:16-alpine
    container_name: issuetracker-db
    environment:
      POSTGRES_DB: issuetracker
      POSTGRES_USER: issuetracker
      POSTGRES_PASSWORD: issuetracker
    ports:
      - "5432:5432"
    volumes:
      - issuetracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuetracker -d issuetracker"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: issuetracker-api:dev
    container_name: issuetracker-api
    build:
      context: .
      dockerfile: src/IssueTracker.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=issuetracker;Username=issuetracker;Password=issuetracker
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  issuetracker-db-data: